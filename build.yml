name: Build MDFS for Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the exe
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MDFS-exe
          path: dist/MDFS.exe
